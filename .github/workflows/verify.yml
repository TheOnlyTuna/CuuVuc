name: Verify CuuVucCore
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: cuuvuc_test
          POSTGRES_USER: cuuvuc_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuuvuc_test -d cuuvuc_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CUUVUC_TEST_URL: jdbc:postgresql://127.0.0.1:5432/cuuvuc_test
      CUUVUC_TEST_USER: cuuvuc_test
      CUUVUC_TEST_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Kiểm thử với PostgreSQL thật
        run: ./mvnw -B -ntp clean verify
      - name: Lưu JAR, checksum và báo cáo
        if: always()
        run: |
          mkdir -p target/ci-artifacts
          if [ -f target/CuuVucCore-0.6.0.jar ]; then
            sha256sum target/CuuVucCore-0.6.0.jar > target/ci-artifacts/SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cuuvuc-${{ github.sha }}
          path: |
            target/CuuVucCore-0.6.0.jar
            target/ci-artifacts/SHA256SUMS.txt
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
