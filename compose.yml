services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: cuuvuc
      POSTGRES_USER: cuuvuc
      POSTGRES_PASSWORD: ${CUUVUC_DB_PASSWORD:?Set CUUVUC_DB_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["cuuvuc-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuuvuc -d cuuvuc"]
      interval: 3s
      timeout: 3s
      retries: 10
  db-test:
    image: postgres:18.4
    profiles: [test]
    environment:
      POSTGRES_DB: cuuvuc_test
      POSTGRES_USER: cuuvuc_test
      POSTGRES_PASSWORD: ${CUUVUC_TEST_PASSWORD:?Set CUUVUC_TEST_PASSWORD}
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuuvuc_test -d cuuvuc_test"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  cuuvuc-data:
